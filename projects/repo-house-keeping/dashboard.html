<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo House Keeping — Migration Dashboard</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#dde1e7;--text:#1b2230;--mut:#5d6879;--acc:#2563eb;--acc2:#dbe7ff;
  --link:#0b57d0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06);
  --c-migrate:#16a34a;--c-update-then-migrate:#2563eb;--c-archive-in-place:#64748b;
  --c-decommission:#dc2626;--c-pending:#d97706;--c-tbd:#9aa3b2;
  --c-active:#16a34a;--c-stable:#0d9488;--c-stale:#d97706;--c-deprecated:#9333ea;--c-unknown:#9aa3b2;
  --c-not-started:#9aa3b2;--c-in-progress:#2563eb;--c-migrated:#0d9488;--c-verified:#16a34a;--c-decommissioned:#7f1d1d;--c-skipped:#64748b;
}
@media (prefers-color-scheme:dark){:root{--link:#8ab4ff;--bg:#0f141b;--panel:#171d27;--panel2:#1e2632;--line:#2b3544;--text:#e6eaf0;--mut:#98a3b5;--acc:#6ea0ff;--acc2:#1f3256;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
header .sub{color:var(--mut);font-size:12px}
header .sp{flex:1}
nav{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:calc(var(--ht,49px) - 1px);z-index:19}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mut);cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
nav .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
main{padding:18px 20px 60px;max-width:1700px;margin:0 auto}
main.wide{max-width:1700px;padding:14px 12px 60px}
.tw.st{overflow:visible}
table.cp{table-layout:auto}
table.cp th,table.cp td{padding:8px 6px;font-size:12.5px}
table.cp th{top:calc(var(--st,96px) - 3px);z-index:5;font-size:12.5px;padding-top:10px;padding-bottom:10px;box-shadow:0 2px 4px rgba(0,0,0,.12)}
table.cp td.flg{white-space:normal;max-width:260px;line-height:1.9}
.ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{display:inline-block;min-width:20px;text-align:center;border-radius:4px;padding:0 4px;font-size:10.5px;font-weight:700;line-height:17px;margin-right:2px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);cursor:help}
.fl.warn{color:var(--warn);border-color:var(--warn)}.fl.bad{color:var(--bad);border-color:var(--bad)}.fl.info{color:var(--acc);border-color:var(--acc)}.fl.ok{color:var(--ok);border-color:var(--ok)}
h2{font-size:14px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:14px 0 6px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.kpi{cursor:pointer}.kpi:hover{border-color:var(--acc)}
.kpi .n{font-size:28px;font-weight:700;line-height:1.1}.kpi .l{color:var(--mut);font-size:12px}
.kpi.warn .n{color:var(--warn)}.kpi.bad .n{color:var(--bad)}.kpi.ok .n{color:var(--ok)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 11px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:2px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
input,select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit}
textarea{width:100%;min-height:70px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--text);font-weight:700;text-transform:capitalize;letter-spacing:.02em;position:sticky;top:96px;background:var(--acc2);border-bottom:2px solid var(--acc);cursor:pointer;white-space:nowrap;z-index:2}
table.nw th,table.nw td{white-space:nowrap}
table.nw td.wrap{white-space:normal;min-width:320px;max-width:520px}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
tr.dirty td:first-child{box-shadow:inset 3px 0 var(--acc)}
tr.endst td{opacity:.45}tr.endst:hover td{opacity:.9}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
.chip{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;line-height:18px;white-space:nowrap;border:1px solid transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.f{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.f.warn{color:var(--warn);border-color:var(--warn)}.f.bad{color:var(--bad);border-color:var(--bad)}.f.info{color:var(--acc);border-color:var(--acc)}
.mut{color:var(--mut)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.src{font-size:11px;padding:0 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2)}
.step.cur{border-color:var(--acc);background:var(--acc2)}.step b{font-size:12px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
ul.clean li:last-child{border:0}
.act{cursor:pointer}.act:hover{color:var(--acc)}
/* map */
.src-box{margin-bottom:16px}.proj{display:inline-block;vertical-align:top;margin:0 10px 10px 0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:330px}
.proj .t{font-size:11px;color:var(--mut);margin-bottom:4px}
.tile{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin:1px;border-radius:5px;color:#fff;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent}
.tile.stg{border:2px dashed var(--text);opacity:.85}.tile.sel{outline:2px solid var(--acc)}
.tile:hover{transform:scale(1.25)}
/* board */
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{flex:0 0 250px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:200px}
.col.over{outline:2px dashed var(--acc)}
.col h4{margin:2px 4px 8px;font-size:12px;display:flex;justify-content:space-between}
.cardi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;cursor:grab;font-size:12px}
.cardi:hover{border-color:var(--acc)}.cardi .nm{font-weight:600;font-size:13px;word-break:break-word}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:50;transform:translateX(105%);transition:.18s;overflow:auto;padding:16px}
#drawer.open{transform:none}
#drawer label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
#drawer select,#drawer input{width:100%}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--mut)}
a.ext{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:5px}
a.ext:hover{color:var(--acc);text-decoration-thickness:2px}a.ext svg{flex:none}
.hint{background:var(--acc2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:99}
pre.b{white-space:pre-wrap;background:var(--panel2);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;max-height:340px;overflow:auto}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}
</style>
</head>

/* ---------- Source notes ---------- */
const NLS = 'rhk-notes-v1'; let NT = {}, NSTAT = {}, NCONF = {}, noteTimer = null;
try { NT = JSON.parse(localStorage.getItem(NLS) || '{}') || {}; } catch (e) {}
const noteText = s => NT[s] != null ? NT[s] : ((D.notes || {})[s] || '');
function persistNT() { try { localStorage.setItem(NLS, JSON.stringify(NT)); } catch (e) {} }
async function saveNote(src) {
  if (NT[src] == null) return;
  if (!LIVE) { persistNT(); NSTAT[src] = 'Saved in this browser only (static mode) — use Download'; return noteStatus(src); }
  NSTAT[src] = 'Saving…'; noteStatus(src);
  try {
    await post('/api/notes', { source: src, old: (D.notes || {})[src] || '', new: NT[src] });
    D.notes[src] = NT[src]; delete NT[src]; persistNT(); delete NCONF[src];
    NSTAT[src] = 'Saved ' + new Date().toLocaleTimeString(); try { lastRev = (await (await fetch('/api/rev', { cache: 'no-store' })).json()).rev; } catch (e) {}
  } catch (err) { NSTAT[src] = 'Not saved: ' + err.message; if (/conflict/.test(err.message)) { try { const r = await fetch('/api/data', { cache: 'no-store' }); NCONF[src] = (await r.json()).notes[src]; } catch (e) {} NSTAT[src] = 'Not saved — the file changed on disk'; vNotes(); return; } }
  noteStatus(src);
}
function noteStatus(src) { const el = $('#noteStat'); if (el && (S.nsrc || SOURCES[0]) === src) el.textContent = NSTAT[src] || ''; }
function vNotes() {
  const src = S.nsrc || SOURCES[0];
  const E = active().map(b => eff(b)).filter(e => e.source === src), byD = count(E, e => e.disposition);
  $('#view').innerHTML = `<div class="bar">${SOURCES.map(s => `<button class="btn ${s === src ? 'pri' : ''}" data-ns="${s}">${s}${noteText(s).replace(/^# .*\n+/, '').trim() ? ' ●' : ''}</button>`).join('')}</div>
   <div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${src}</b> <span class="mut small">${E.length} repos</span> ${Object.entries(byD).map(([d, n]) => `<span class="chip f">${d} ${n}</span>`).join(' ')}</div>
     <div class="small mut"><span id="noteStat">${esc(NSTAT[src] || '')}</span> · spec/notes/${src}.md</div></div>
     ${NCONF[src] != null ? `<div class="hint" style="margin-top:8px">The file changed on disk while you were editing. <button class="btn sm" id="nKeep">Keep mine (overwrite)</button> <button class="btn sm" id="nLoad">Load disk version</button></div>` : ''}
     <textarea id="noteText" spellcheck="true" style="min-height:62vh;margin-top:10px;font:13px/1.5 ui-monospace,Consolas,monospace" placeholder="Ad-hoc working notes for ${src}: findings, questions, follow-ups…">${esc(noteText(src))}</textarea>
     <div class="small mut" style="margin-top:6px">Markdown/plain text. ${LIVE ? 'Saves automatically while you type.' : 'Static mode: kept in this browser; use Download to put it in the folder.'} Claude reads these files too.
       ${LIVE ? '' : `<button class="btn sm" id="nDl">Download ${src}.md</button>`}</div></div>`;
  document.querySelectorAll('[data-ns]').forEach(b => b.onclick = () => { S.nsrc = b.dataset.ns; vNotes(); });
  $('#noteText').oninput = ev => { NT[src] = ev.target.value; NSTAT[src] = 'Unsaved…'; noteStatus(src); persistNT(); clearTimeout(noteTimer); noteTimer = setTimeout(() => saveNote(src), 800); };
  $('#noteText').onblur = () => { clearTimeout(noteTimer); saveNote(src); };
  if ($('#nKeep')) $('#nKeep').onclick = () => { D.notes[src] = NCONF[src]; delete NCONF[src]; saveNote(src).then(vNotes); };
  if ($('#nLoad')) $('#nLoad').onclick = () => { D.notes[src] = NCONF[src]; delete NCONF[src]; delete NT[src]; persistNT(); NSTAT[src] = 'Loaded disk version'; vNotes(); };
  if ($('#nDl')) $('#nDl').onclick = () => dl(src + '.md', noteText(src));
}

  const bRows = D.builds.map(x => { const m = D.register.find(r => r.name === x.repo_name && r.source === x._src); const stale = !x.last_build || (TODAY - new Date(x.last_build)) / 864e5 > 365; return `<tr><td>${esc(x.project)}</td><td>${esc(x.definition)}</td><td>${esc(x.repo_name)} ${m ? '' : '<span class="chip f bad">repo not in register</span>'}</td><td>${esc(x.last_build || 'never')} ${stale ? '<span class="chip f">idle &gt;1y</span>' : ''}</td><td>${esc(x.last_result)}</td></tr>`; }).join('');
  const sRows = D.svc.map(x => `<tr><td>${esc(x.project)}</td><td>${esc(x.name)}</td><td><span class="chip f ${x.type === 'AWS' ? 'warn' : ''}">${esc(x.type)}</span></td><td>${esc(x.created_by)} ${/ncssoftware/i.test(x.created_by) ? '<span class="chip f warn">former tenant</span>' : ''}</td></tr>`).join('');
  const pRows = D.pkgdeps.map(x => `<tr><td class="mono">${esc(x.package_id)}</td><td>${esc(x.feed)} ${esc(x.latest_version)}</td><td>${pill(x.check_status === 'not-checked' ? 'unknown' : 'verified').replace(/>[^<]*</, '>' + esc(x.check_status) + '<')}</td><td class="small wrap">${esc(x.consumers_found || '')}</td><td class="small mut wrap">${esc(x.notes)}</td></tr>`).join('');
  const mc = D.mycommits.map(x => `<tr><td>${esc(x.project)}</td><td>${esc(x.repo)}</td><td>${esc(x.vc)}</td><td>${esc(x.my_commits)}</td><td>${esc(x.my_last_commit)}</td></tr>`).join('');
  const T = (h, body) => `<div class="tw"><table class="nw"><thead><tr>${h.map(x => `<th style="top:auto;cursor:default">${x}</th>`).join('')}</tr></thead><tbody>${body || '<tr><td class="mut">None</td></tr>'}</tbody></table></div>`;
  $('#view').innerHTML = `<div class="grid">
   <div><h2>Package feeds (not moved by GitHub Importer)</h2>${T(['source', 'feed', 'packages', 'published 2026', 'latest', ''], feedRows)}</div>
   <div><h2>Held-library package consumers (spec/package-dependencies.csv)</h2>${T(['package', 'feed / version', 'check', 'consumers', 'notes'], pRows)}</div>
   <div><h2>Build pipelines</h2>${T(['project', 'definition', 'repo', 'last build', 'result'], bRows)}</div>
   <div><h2>Service connections</h2>${T(['project', 'name', 'type', 'created by'], sRows)}<div class="small mut" style="margin-top:4px">Do not migrate pipelines until repos are verified. AWS connections → revoke IAM keys in Phase 5 (R-015).</div></div>
   <div><h2>Repos you’ve committed to that aren’t in the register</h2>${T(['project', 'repo', 'vc', 'your commits', 'last'], mc)}</div></div>`;
}

/* ---------- Risks & decisions ---------- */
function vRisks() {
  const rs = D.risks.filter(r => S.rstat === 'All' || r.status.toLowerCase().startsWith(S.rstat.toLowerCase()));
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  $('#view').innerHTML = `<div class="grid g2" style="align-items:start">
   <div><h2>Risk register</h2><div class="bar">${['Open', 'Accepted', 'Closed', 'All'].map(s => `<button class="btn sm ${S.rstat === s ? 'pri' : ''}" data-rs="${s}">${s}</button>`).join('')}</div>
   <div class="tw"><table><tbody>${rs.map(r => `<tr><td class="mono" style="white-space:nowrap">${r.id}<br><span class="chip f ${/open/i.test(r.status) ? 'bad' : ''}">${esc(r.status)}</span></td><td><b>${md(r.risk)}</b><div class="small">${md(r.impact)}</div><div class="small mut">↳ ${md(r.mitigation)}</div></td></tr>`).join('')}</tbody></table></div></div>
   <div><h2>Decision log</h2><div class="card">${D.decisions.slice().reverse().map(d => `<details><summary>${d.id} · ${esc(d.title)} <span class="mut small">${d.date}</span></summary><pre class="b">${esc(d.body)}</pre></details>`).join('')}</div></div></div>`;
  document.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { S.rstat = b.dataset.rs; vRisks(); });
}

/* ---------- Work queue ---------- */
const allTasks = () => D.tasks.map(t => Object.assign({}, t, P.taskEdits[t.id] || {})).concat(P.newTasks);
function vWork() {
  const T = allTasks().filter(t => !S.owner || t.owner === S.owner);
  const pr = { urgent: 0, high: 1, medium: 2, low: 3 };
  $('#view').innerHTML = `<div class="bar"><b>Owner</b> <select id="wo">${opts(['', 'Chase', 'Claude'], S.owner, { '': 'everyone' })}</select> <button class="btn sm" id="addT">+ Task</button>
    <span class="mut small">Tasks live in spec/tasks.csv. ${LIVE ? 'Changes save automatically.' : 'Changes queue until you export.'} “Hand to Claude” copies a ready prompt.</span></div>
   <div class="board">${TSTAT.map(st => `<div class="col" style="flex-basis:300px" data-tst="${st}"><h4><span>${st}</span><span class="mut">${T.filter(t => t.status === st).length}</span></h4>
     ${T.filter(t => t.status === st).sort((a, b) => (pr[a.priority] ?? 9) - (pr[b.priority] ?? 9)).map(t => `<div class="cardi" draggable="true" data-tid="${t.id}" style="cursor:grab"><div class="nm">${esc(t.id)} · ${esc(t.title)}</div>
       <div class="small"><span class="chip f ${t.owner === 'Claude' ? 'info' : ''}">${esc(t.owner)}</span> <span class="chip f ${t.priority === 'urgent' ? 'bad' : ''}">${esc(t.priority)}</span> <span class="chip f">phase ${esc(t.phase)}</span>${t.due ? ` <span class="chip f warn">due ${esc(t.due)}</span>` : ''}${t.linked ? ` <span class="mut">${esc(t.linked)}</span>` : ''}</div>
       ${t.notes ? `<div class="small mut" style="margin-top:3px">${esc(t.notes)}</div>` : ''}
       <div style="margin-top:5px;display:flex;gap:5px"><select data-ts="${t.id}">${TSTAT.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select>${t.owner === 'Claude' ? `<button class="btn sm" data-hand="${t.id}">Hand to Claude</button>` : ''}</div></div>`).join('')}</div>`).join('')}</div>`;
  $('#wo').onchange = ev => { S.owner = ev.target.value; vWork(); };
  const setT = (id, st) => { const base = D.tasks.find(t => t.id === id); if (base) { const cur = P.taskEdits[id] || {}; if (base.status === st) delete cur.status; else cur.status = st; if (Object.keys(cur).length) P.taskEdits[id] = cur; else delete P.taskEdits[id]; } else { const n = P.newTasks.find(t => t.id === id); if (n) n.status = st; } save(); vWork(); };
  document.querySelectorAll('[data-ts]').forEach(s => s.onchange = () => setT(s.dataset.ts, s.value));
  document.querySelectorAll('[data-hand]').forEach(b => b.onclick = () => { const t = allTasks().find(x => x.id === b.dataset.hand); copy(`Task ${t.id} (phase ${t.phase}, ${t.priority}): ${t.title}\nLinked: ${t.linked || '-'}\nNotes: ${t.notes || '-'}\nPlease do this task, update the relevant files (repo-register.csv / package-dependencies.csv / risks.md as needed), show exact CSV diffs, and mark ${t.id} done in spec/tasks.csv.`); });
  document.querySelectorAll('.col[data-tst]').forEach(col => { col.ondragover = ev => { ev.preventDefault(); col.classList.add('over'); }; col.ondragleave = () => col.classList.remove('over'); col.ondrop = ev => { ev.preventDefault(); const id = ev.dataTransfer.getData('text/plain'); if (id) setT(id, col.dataset.tst); }; });
  document.querySelectorAll('.cardi[data-tid]').forEach(c => c.ondragstart = ev => ev.dataTransfer.setData('text/plain', c.dataset.tid));
  $('#addT').onclick = () => { const title = prompt('Task title?'); if (!title) return; const owner = (prompt('Owner (Chase / Claude)?', 'Chase') || 'Chase'); const n = Math.max(0, ...allTasks().map(t => +t.id.replace(/\D/g, ''))) + 1; P.newTasks.push({ id: 'T-' + String(n).padStart(2, '0'), title, owner, phase: String(D.phase), status: 'todo', priority: 'medium', due: '', linked: '', notes: '' }); save(); vWork(); };
}
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied — paste into Claude'), () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Copied — paste into Claude'); } catch (e) { prompt('Copy:', t); } a.remove(); }); }

/* ---------- Changes / export ---------- */
const csvCell = v => { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCsv = (cols, rows) => (D.bom ? '﻿' : '') + [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join(D.eol || '\n') + (D.eol || '\n');
function buildExports() {
  const maxId = Math.max(0, ...D.register.map(r => +r.id || 0)); let nid = maxId;
  const rows = D.register.map(r => Object.assign({}, r, P.edits['r:' + r.id] || {}));
  const adds = BASE.filter(b => b.kind === 'stg' && P.accepted[b.key]).map(b => { const r = Object.assign({}, eff(b)); r.id = String(++nid); return r; });
  const diff = [];
  D.register.forEach(r => { const ed = P.edits['r:' + r.id]; if (!ed) return; diff.push(`id ${r.id} · ${r.name} (${r.source})`); Object.keys(ed).forEach(f => diff.push(`  ${f}: ${r[f] || '(blank)'} → ${ed[f] || '(blank)'}`)); });
  adds.forEach(r => diff.push(`NEW id ${r.id} · ${r.name} (${r.source}) — ${r.disposition}/${r.classification}/${r.migration_status}`));
  const tasks = allTasks(); const tcols = ['id', 'title', 'owner', 'phase', 'status', 'priority', 'due', 'linked', 'notes'];
  const tdiff = D.tasks.filter(t => P.taskEdits[t.id]).map(t => `${t.id}: status ${t.status} → ${P.taskEdits[t.id].status}`).concat(P.newTasks.map(t => `NEW ${t.id}: ${t.title} (${t.owner})`));
  return { register: toCsv(COLS, rows.concat(adds)), tasks: toCsv(tcols, tasks), diff: `## repo-register.csv updates (${D.built})\n\n` + (diff.join('\n') || '(none)') + `\n\n## tasks.csv updates\n\n` + (tdiff.join('\n') || '(none)') + '\n', adds, diffLines: diff, tdiff };
}
function dl(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function vChanges() {
  const x = buildExports(), n = pendingCount();
  $('#view').innerHTML = `<div class="bar"><h2 style="margin:0">Pending changes</h2><span class="mut">${LIVE ? (n ? n + ' not yet saved — retrying automatically; you can also export below.' : 'Nothing pending: live mode saves each edit straight to spec/*.csv (old versions in spec/.backups/).') : n + ' queued — nothing touches your files until you export + apply.'}</span></div>
  <div class="bar"><button class="btn pri" id="eReg" ${n ? '' : 'disabled'}>Download repo-register.csv</button><button class="btn" id="eTask">Download tasks.csv</button><button class="btn" id="eDiff">Download diff.md</button><button class="btn" id="eCopy">Copy diff for Claude</button><button class="btn danger" id="eClear" ${n ? '' : 'disabled'}>Discard all</button></div>
  <div class="card small" style="margin-bottom:12px">Apply: drop the downloaded CSV over <span class="mono">spec/repo-register.csv</span> (or paste the diff to Claude and ask it to apply), then rerun <span class="mono">python scripts/build_dashboard.py</span>. Rows are never deleted; new rows get ids ${x.adds.length ? Math.max(...x.adds.map(a => +a.id)) - x.adds.length + 1 + '–' + Math.max(...x.adds.map(a => +a.id)) : ''} on export. Decommission needs your written confirmation (recorded in notes).</div>
  <pre class="b">${esc(x.diff)}</pre>
  ${Object.keys(P.edits).length ? '<h3>Revert individual rows</h3>' + Object.keys(P.edits).map(k => `<span class="chip f act" data-rv="${esc(k)}">✕ ${esc(BY[k].o.name)}</span> `).join('') : ''}`;
  $('#eReg').onclick = () => dl('repo-register.csv', x.register); $('#eTask').onclick = () => dl('tasks.csv', x.tasks); $('#eDiff').onclick = () => dl('diff.md', x.diff);
  $('#eCopy').onclick = () => copy(x.diff + '\nPlease apply these updates to spec/repo-register.csv / spec/tasks.csv, keeping existing rows (never delete).');
  $('#eClear').onclick = () => { if (confirm('Discard all pending changes?')) { P = { edits: {}, accepted: {}, taskEdits: {}, newTasks: [] }; save(); vChanges(); } };
  document.querySelectorAll('[data-rv]').forEach(c => c.onclick = () => { revertRow(c.dataset.rv); vChanges(); });
}

$('#built').textContent = D.built;
$('#hExport').onclick = () => go('changes');
$('#incStaged').onchange = () => render();
render();
setLive(liveState);
if (LIVE && pendingCount()) queueFlush();   // push anything left over from a previous session
</script>
</body>
</html>
