<div style="font-family:var(--font-sans)">
  <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;background:var(--surface-1);border-radius:16px;padding:20px 12px;border:0.5px solid var(--border)">

    <div style="width:270px;border-radius:26px;border:0.5px solid var(--border-strong);background:var(--surface-0);overflow:hidden;box-shadow:var(--shadow-md)">
      <div style="height:26px;background:#1D3455;display:flex;align-items:center;justify-content:center"><div style="width:70px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)"></div></div>

      <div style="background:#1D3455;color:#fff;padding:6px 14px 12px">
        <div style="display:flex;align-items:center;gap:12px">
          <i class="ti ti-menu-2" style="font-size:21px" aria-hidden="true"></i>
          <div style="flex:1;min-width:0">
            <p style="font-size:15px;font-weight:500;margin:0">Library</p>
            <p style="font-size:11px;margin:0;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Dept. of Records — NSW</p>
          </div>
          <i class="ti ti-search" style="font-size:20px" aria-hidden="true"></i>
          <div style="width:28px;height:28px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500">AK</div>
        </div>
      </div>

      <div style="display:flex;gap:5px;padding:10px 12px 8px;overflow:hidden">
        <span style="font-size:11px;font-weight:500;background:var(--bg-accent);color:var(--text-accent);border-radius:20px;padding:4px 11px;white-space:nowrap">All</span>
        <span style="font-size:11px;color:var(--text-secondary);border:0.5px solid var(--border);border-radius:20px;padding:4px 11px;white-space:nowrap">Published</span>
        <span style="font-size:11px;color:var(--text-secondary);border:0.5px solid var(--border);border-radius:20px;padding:4px 11px;white-space:nowrap">In review</span>
      </div>

      <div id="mlist" style="height:326px;overflow:hidden"></div>

      <div style="display:flex;align-items:stretch;border-top:0.5px solid var(--border);background:var(--surface-2)">
        <div style="flex:1;text-align:center;padding:8px 0;color:var(--text-accent)"><i class="ti ti-photo" style="font-size:21px" aria-hidden="true"></i><p style="font-size:10px;margin:2px 0 0;font-weight:500">Library</p></div>
        <div style="flex:1;text-align:center;padding:8px 0;color:var(--text-muted)"><i class="ti ti-search" style="font-size:21px" aria-hidden="true"></i><p style="font-size:10px;margin:2px 0 0">Search</p></div>
        <div style="flex:1;display:flex;justify-content:center;align-items:center"><div style="width:44px;height:44px;border-radius:50%;background:#1D3455;display:flex;align-items:center;justify-content:center;margin-top:-14px;border:3px solid var(--surface-2)"><i class="ti ti-plus" style="font-size:24px;color:#fff" aria-hidden="true"></i></div></div>
        <div style="flex:1;text-align:center;padding:8px 0;color:var(--text-muted);position:relative"><i class="ti ti-git-pull-request" style="font-size:21px" aria-hidden="true"></i><span style="position:absolute;top:5px;right:22px;background:#E24B4A;color:#fff;font-size:9px;font-weight:500;border-radius:9px;padding:0 4px">5</span><p style="font-size:10px;margin:2px 0 0">Reviews</p></div>
        <div style="flex:1;text-align:center;padding:8px 0;color:var(--text-muted)"><i class="ti ti-dots" style="font-size:21px" aria-hidden="true"></i><p style="font-size:10px;margin:2px 0 0">More</p></div>
      </div>
    </div>

    <div style="width:270px;border-radius:26px;border:0.5px solid var(--border-strong);background:var(--surface-0);overflow:hidden;box-shadow:var(--shadow-md);position:relative">
      <div style="height:26px;background:#1D3455;display:flex;align-items:center;justify-content:center"><div style="width:70px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)"></div></div>
      <div style="position:absolute;inset:26px 0 0;background:rgba(0,0,0,.4)"></div>
      <div style="position:absolute;top:26px;bottom:0;left:0;width:212px;background:var(--surface-2);border-right:0.5px solid var(--border);display:flex;flex-direction:column">
        <div style="background:#1D3455;color:#fff;padding:14px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">AK</div>
            <div style="min-width:0"><p style="font-size:13px;font-weight:500;margin:0">Akshay Kaur</p><p style="font-size:11px;margin:0;opacity:.7">Records officer</p></div>
          </div>
          <button style="margin-top:11px;width:100%;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);border:0.5px solid rgba(255,255,255,.22);color:#fff;height:32px;padding:0 10px;border-radius:8px;font-size:12px;cursor:pointer">
            <i class="ti ti-building-community" style="font-size:14px" aria-hidden="true"></i><span style="flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Dept. of Records</span><i class="ti ti-selector" style="font-size:14px;opacity:.7" aria-hidden="true"></i>
          </button>
        </div>
        <div id="mdraw" style="flex:1;padding:8px 8px;overflow:hidden"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var st={
    Published:{bg:'#E1F5EE',fg:'#0F6E56'},
    PendingApproval:{bg:'#FAEEDA',fg:'#854F0B',lab:'In review'},
    Revising:{bg:'#E6F1FB',fg:'#185FA5'},
    Draft:{bg:'var(--surface-1)',fg:'var(--text-secondary)'}
  };
  var items=[
    {t:'DA-2024-0417 — Lot 42 Rouse Hill',s:'Published',v:3,lock:false,conf:false},
    {t:'DA-2024-0392 — Kellyville subdivision',s:'PendingApproval',v:2,lock:true,conf:false},
    {t:'DA-2024-0410 — Box Hill industrial',s:'Revising',v:4,lock:true,conf:false},
    {t:'DA-2024-0388 — Marsden Park lot 9',s:'Draft',v:0,lock:false,conf:true}
  ];
  var l=document.getElementById('mlist');
  items.forEach(function(it){
    var s=st[it.s];
    var flags='';
    if(it.lock)flags+='<i class="ti ti-lock" style="font-size:12px;color:var(--text-warning)" aria-hidden="true"></i>';
    if(it.conf)flags+='<i class="ti ti-alert-triangle" style="font-size:12px;color:#BA7517" aria-hidden="true"></i>';
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:0.5px solid var(--border)';
    d.innerHTML='<i class="ti ti-file-description" style="font-size:22px;color:var(--text-muted);flex-shrink:0" aria-hidden="true"></i>'+
      '<div style="flex:1;min-width:0">'+
      '<p style="font-size:12px;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+it.t+'</p>'+
      '<div style="display:flex;align-items:center;gap:6px;margin-top:4px">'+
      '<span style="font-size:10px;font-weight:500;color:'+s.fg+';background:'+s.bg+';border-radius:5px;padding:1px 7px">'+(s.lab||it.s)+'</span>'+
      '<span style="font-size:10px;color:var(--text-muted)">'+(it.v>0?'v'+it.v:'—')+'</span>'+flags+
      '</div></div><i class="ti ti-chevron-right" style="font-size:16px;color:var(--text-muted);flex-shrink:0" aria-hidden="true"></i>';
    l.appendChild(d);
  });

  var nav=[
    {i:'ti-photo',l:'Library',a:true},{i:'ti-search',l:'Search'},{i:'ti-cloud-upload',l:'Uploads',b:'3'},
    {i:'ti-git-pull-request',l:'Change requests',b:'5'},{i:'ti-certificate',l:'Registrations'},{i:'ti-signature',l:'Signing'},
    {sep:'Admin'},{i:'ti-forms',l:'Record types'},{i:'ti-users',l:'Users'}
  ];
  var dr=document.getElementById('mdraw');
  nav.forEach(function(n){
    if(n.sep){var s=document.createElement('div');s.textContent=n.sep;s.style.cssText='font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 8px 4px';dr.appendChild(s);return;}
    var a=document.createElement('div');
    a.style.cssText='display:flex;align-items:center;gap:11px;height:34px;padding:0 8px;border-radius:8px;font-size:12px;margin-bottom:1px;'+(n.a?'background:var(--bg-accent);color:var(--text-accent);font-weight:500':'color:var(--text-secondary)');
    a.innerHTML='<i class="ti '+n.i+'" style="font-size:18px" aria-hidden="true"></i><span style="flex:1">'+n.l+'</span>'+(n.b?'<span style="font-size:10px;background:var(--surface-0);border:0.5px solid var(--border);border-radius:9px;padding:0 6px;color:var(--text-secondary)">'+n.b+'</span>':'');
    dr.appendChild(a);
  });
})();
</script>
