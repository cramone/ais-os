<div style="font-family:var(--font-sans)">
  <div style="max-width:560px;margin:0 auto;background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;overflow:hidden">
    <div style="padding:16px 22px;border-bottom:0.5px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-bottom:8px"><i class="ti ti-arrow-left" style="font-size:15px" aria-hidden="true"></i><span>Library</span><i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i><span style="color:var(--text-secondary)">New item</span></div>
      <h1 style="font-size:19px;margin:0">Create media item</h1>
      <p style="font-size:12px;color:var(--text-secondary);margin:5px 0 0">The profile sets the metadata schema, asset roles, and policies — it can’t be changed later.</p>
    </div>
    <div style="padding:18px 22px">
      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Media profile <span style="color:var(--text-danger)">*</span></label>
      <div style="display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border:0.5px solid var(--border-strong);border-radius:9px;margin-bottom:4px;cursor:pointer;background:var(--surface-2)"><i class="ti ti-adjustments" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i><span style="flex:1;font-size:13px">Development consent</span><i class="ti ti-chevron-down" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i></div>
      <p style="font-size:11px;color:var(--text-muted);margin:0 0 16px">Published profiles only · requires review to publish · 3 asset roles</p>

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Title <span style="color:var(--text-danger)">*</span></label>
      <input type="text" value="Consent DA-2024-0451 — Marsden Park North" style="width:100%;height:38px;margin-bottom:16px" />

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
        <div>
          <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Folder</label>
          <div style="display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border:0.5px solid var(--border-strong);border-radius:9px;cursor:pointer;background:var(--surface-2)"><i class="ti ti-folder" style="font-size:16px;color:#BA7517" aria-hidden="true"></i><span style="flex:1;font-size:13px">2024 development consents</span><i class="ti ti-chevron-down" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i></div>
          <p style="font-size:11px;color:var(--text-muted);margin:4px 0 0">Leave empty → Unassigned pool</p>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Record date</label>
          <input type="text" value="2024-03-14" style="width:100%;height:38px" />
        </div>
      </div>

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Author</label>
      <input type="text" value="Planning Assessment Team" style="width:100%;height:38px;margin-bottom:16px" />

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Description</label>
      <textarea style="width:100%;min-height:56px;resize:vertical;margin-bottom:20px;font-family:inherit">Development consent for the Marsden Park North stage 3 subdivision.</textarea>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button style="height:38px;padding:0 16px;border-radius:9px;font-size:13px;cursor:pointer;background:transparent;border:0.5px solid var(--border-strong)">Cancel</button>
        <button style="height:38px;padding:0 18px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;background:var(--accent);border:none;color:#fff">Create item</button>
      </div>
    </div>
  </div>
</div>
