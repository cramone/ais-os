<div style="font-family:var(--font-sans)">
  <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;background:var(--surface-1);border-radius:16px;padding:26px 16px;border:0.5px solid var(--border)">

    <div style="width:320px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;overflow:hidden">
      <div style="background:#1D3455;padding:22px 24px 20px;text-align:center">
        <div style="width:44px;height:44px;border-radius:10px;background:#1D3455;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px;font-weight:500;color:#fff">M</div>
        <p style="font-size:16px;font-weight:500;color:#fff;margin:0">MAGIQ Media</p>
        <p style="font-size:12px;color:rgba(255,255,255,.65);margin:3px 0 0">Records and media management</p>
      </div>
      <div style="padding:22px 24px 24px">
        <p style="font-size:13px;color:var(--text-secondary);text-align:center;margin:0 0 18px;line-height:1.5">Sign in with your organisation account. You’ll be taken to your identity provider.</p>
        <button style="width:100%;height:42px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;background:#1D3455;border:none;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px"><i class="ti ti-shield-lock" style="font-size:18px" aria-hidden="true"></i>Continue with magiq-auth</button>
        <div style="display:flex;align-items:center;gap:8px;margin:16px 0;color:var(--text-muted)"><div style="flex:1;height:0.5px;background:var(--border)"></div><span style="font-size:11px">secure single sign-on</span><div style="flex:1;height:0.5px;background:var(--border)"></div></div>
        <div style="display:flex;align-items:flex-start;gap:8px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:9px;padding:10px 12px">
          <i class="ti ti-lock" style="font-size:15px;color:var(--text-secondary);flex-shrink:0;margin-top:1px" aria-hidden="true"></i>
          <p style="font-size:11px;color:var(--text-secondary);margin:0;line-height:1.5">No password is entered here. Credentials go only to your identity provider.</p>
        </div>
      </div>
    </div>

    <div style="width:280px;padding-top:6px">
      <p style="font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px">What happens on sign-in</p>
      <div id="flow"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var steps=[
    {ic:'ti-dice',t:'PKCE challenge generated',d:'code_verifier + code_challenge created client-side'},
    {ic:'ti-external-link',t:'Redirect to magiq-auth',d:'authorization code flow — no credentials touch this app'},
    {ic:'ti-user-check',t:'You authenticate there',d:'password, MFA, and tenant selection happen at the IdP'},
    {ic:'ti-arrow-back-up',t:'Redirect back with code',d:'exchanged for tokens using the code_verifier'},
    {ic:'ti-key',t:'Access token → memory only',d:'refresh token in httpOnly SameSite cookie · nothing in localStorage'}
  ];
  var fh=document.getElementById('flow');
  steps.forEach(function(s,i){
    var el=document.createElement('div');
    el.style.cssText='display:flex;gap:11px;padding-bottom:'+(i<steps.length-1?'14px':'0')+'';
    el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0"><div style="width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center"><i class="ti '+s.ic+'" style="font-size:14px;color:var(--text-accent)" aria-hidden="true"></i></div>'+(i<steps.length-1?'<div style="width:2px;flex:1;background:var(--border);margin-top:2px"></div>':'')+'</div>'+
      '<div style="flex:1;min-width:0;padding-top:2px"><p style="font-size:13px;font-weight:500;margin:0">'+s.t+'</p><p style="font-size:11px;color:var(--text-muted);margin:2px 0 0;line-height:1.45">'+s.d+'</p></div>';
    fh.appendChild(el);
  });
})();
</script>
