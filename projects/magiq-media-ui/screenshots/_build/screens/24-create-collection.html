<div style="font-family:var(--font-sans)">
  <div style="max-width:520px;margin:0 auto;background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;overflow:hidden">
    <div style="padding:16px 22px;border-bottom:0.5px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-bottom:8px"><i class="ti ti-arrow-left" style="font-size:15px" aria-hidden="true"></i><span>Collections</span><i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i><span style="color:var(--text-secondary)">New</span></div>
      <h1 style="font-size:19px;margin:0">Create collection</h1>
    </div>
    <div style="padding:18px 22px">
      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Name <span style="color:var(--text-danger)">*</span></label>
      <input type="text" value="Building certificates" style="width:100%;height:38px;margin-bottom:16px" />

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Description</label>
      <textarea style="width:100%;min-height:52px;resize:vertical;margin-bottom:16px;font-family:inherit">Occupation and construction certificates issued under the 2024 planning scheme.</textarea>

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Visibility</label>
      <div style="display:flex;gap:6px;margin-bottom:16px">
        <button style="flex:1;height:38px;border-radius:9px;font-size:12px;cursor:pointer;background:var(--bg-accent);border:0.5px solid var(--border-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-lock" style="font-size:15px" aria-hidden="true"></i>Private</button>
        <button style="flex:1;height:38px;border-radius:9px;font-size:12px;cursor:pointer;background:transparent;border:0.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-link" style="font-size:15px" aria-hidden="true"></i>Unlisted</button>
        <button style="flex:1;height:38px;border-radius:9px;font-size:12px;cursor:pointer;background:transparent;border:0.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;gap:6px"><i class="ti ti-world" style="font-size:15px" aria-hidden="true"></i>Public</button>
      </div>

      <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px">Default media profile</label>
      <div style="display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border:0.5px solid var(--border-strong);border-radius:9px;margin-bottom:4px;cursor:pointer;background:var(--surface-2)"><i class="ti ti-adjustments" style="font-size:16px;color:var(--text-muted)" aria-hidden="true"></i><span style="flex:1;font-size:13px;color:var(--text-muted)">None — choose per item</span><i class="ti ti-chevron-down" style="font-size:15px;color:var(--text-muted)" aria-hidden="true"></i></div>
      <p style="font-size:11px;color:var(--text-muted);margin:0 0 20px">Optional — new items in this collection default to this profile.</p>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button style="height:38px;padding:0 16px;border-radius:9px;font-size:13px;cursor:pointer;background:transparent;border:0.5px solid var(--border-strong)">Cancel</button>
        <button style="height:38px;padding:0 18px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;background:var(--accent);border:none;color:#fff">Create collection</button>
      </div>
      <p style="font-size:11px;color:var(--text-muted);margin:14px 0 0;text-align:center">Creating a <strong style="font-weight:500">folder</strong> uses the same form plus a parent-folder picker and optional opened/closed dates.</p>
    </div>
  </div>
</div>
